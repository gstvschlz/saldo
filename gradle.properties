org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# KSP is not yet compatible with AGP 9's built-in Kotlin (google/ksp#2615),
# so Kotlin comes from the classic plugin until upstream support lands.
android.builtInKotlin=false
# The classic kotlin-android plugin still casts the android{} extension to the
# legacy com.android.build.gradle.BaseExtension type, which AGP 9's new DSL no
# longer implements. Opt back into the legacy extension types until the
# kotlin-android plugin is updated for the new DSL.
android.newDsl=false

kotlin.code.style=official
