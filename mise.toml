[tools]
java = "temurin-21"
gradle = "9.7.0"
android-sdk = "22.0"

# Every task has a POSIX `run` and a Windows `run_windows`: mise runs tasks through
# `sh -c` on POSIX and `cmd /c` on Windows, and cmd cannot execute `./gradlew`
# (nor find a bare `gradlew.bat` when NoDefaultCurrentDirectoryInExePath is set).

[tasks.build]
description = "Compile the debug APK"
run = "./gradlew assembleDebug"
run_windows = '.\gradlew.bat assembleDebug'

[tasks.compile]
description = "Compile the debug Kotlin sources (faster than a full build)"
run = "./gradlew compileDebugKotlin"
run_windows = '.\gradlew.bat compileDebugKotlin'

[tasks.test]
description = "Run unit tests"
run = "./gradlew test"
run_windows = '.\gradlew.bat test'

[tasks.test-device]
description = "Run instrumented tests on the connected device/emulator"
run = "./gradlew connectedDebugAndroidTest"
run_windows = '.\gradlew.bat connectedDebugAndroidTest'

[tasks.lint]
description = "Run Android Lint"
run = "./gradlew lint"
run_windows = '.\gradlew.bat lint'

[tasks.install]
description = "Install the debug APK on a connected device/emulator"
run = "./gradlew installDebug"
run_windows = '.\gradlew.bat installDebug'

[tasks.clean]
description = "Delete build outputs"
run = "./gradlew clean"
run_windows = '.\gradlew.bat clean'

[tasks.sdk-setup]
description = "Install the Android SDK packages this project needs"
run = 'sdkmanager "platform-tools" "platforms;android-37.1" "build-tools;37.0.0"'
